name: nxnative IPA build

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install xcodegen zstd spirv-cross
          brew install --cask dotnet-sdk

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install \
            lz4 capstone fonttools \
            google-api-python-client google-auth \
            google-auth-oauthlib

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Rebase shader tool lock on runner tools
        env:
          DM_GAME: "010093801237C000"
        run: |
          python3 dm/gfx/tools/dmsh_chain.py --update-lock
          python3 dm/gfx/tools/dmsh_chain.py --header
          python3 dm/gfx/tools/dmsh_chain.py --check-tools

      - name: Prepare credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
        run: |
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" \
            > "$RUNNER_TEMP/google-service-account.json"

          printf '%s' "$PROD_KEYS" \
            > "$RUNNER_TEMP/prod.keys"

          test -s "$RUNNER_TEMP/google-service-account.json"
          test -s "$RUNNER_TEMP/prod.keys"
          test -f scripts/build_ipa_from_nsp.py

      - name: Download game files from Google Drive
