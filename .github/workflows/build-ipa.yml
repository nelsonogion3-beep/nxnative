name: nxnative IPA build

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install xcodegen zstd spirv-cross
          brew install --cask dotnet-sdk

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install \
            lz4 capstone fonttools \
            google-api-python-client google-auth \
            google-auth-oauthlib

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Rebase shader tool lock on runner tools
        env:
          DM_GAME: "010093801237C000"
        run: |
          python3 dm/gfx/tools/dmsh_chain.py --update-lock
          python3 dm/gfx/tools/dmsh_chain.py --header
          python3 dm/gfx/tools/dmsh_chain.py --check-tools

      - name: Prepare credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
        run: |
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" \
            > "$RUNNER_TEMP/google-service-account.json"

          printf '%s' "$PROD_KEYS" \
            > "$RUNNER_TEMP/prod.keys"

          test -s "$RUNNER_TEMP/google-service-account.json"
          test -s "$RUNNER_TEMP/prod.keys"
          test -f scripts/build_ipa_from_nsp.py

      - name: Download game files from Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          INPUT_FOLDER: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          cat > "$RUNNER_TEMP/drive.py" <<'PY'
          import os
          import pathlib

          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import (
              MediaIoBaseDownload,
              MediaFileUpload
          )

          KEY = os.path.join(
              os.environ["RUNNER_TEMP"],
              "google-service-account.json"
          )

          SCOPES = [
              "https://www.googleapis.com/auth/drive"
          ]

          creds = service_account.Credentials.from_service_account_file(
              KEY,
              scopes=SCOPES
          )

          drive = build(
              "drive",
              "v3",
              credentials=creds,
              cache_discovery=False
          )

          def download_game():
              folder = os.environ["INPUT_FOLDER"]

              dest = (
                  pathlib.Path(os.environ["RUNNER_TEMP"]) / "game"
              )
              dest.mkdir(exist_ok=True)

              response = drive.files().list(
                  q=f"'{folder}' in parents and trashed = false",
                  fields="files(id,name,size,mimeType)",
                  pageSize=100
              ).execute()

              files = [
                  f for f in response.get("files", [])
                  if f["name"].lower().endswith(".nsp")
              ]

              if not files:
                  raise RuntimeError(
                      "Nessun file NSP trovato nella cartella Drive."
                  )

              total = 0

              for f in files:
                  path = dest / f["name"]

                  print(
                      "Scaricamento:",
                      f["name"],
                      "dimensione:",
                      f.get("size", "sconosciuta")
                  )

                  request = drive.files().get_media(
                      fileId=f["id"]
                  )

                  with open(path, "wb") as out:
                      downloader = MediaIoBaseDownload(
                          out,
                          request,
                          chunksize=16 * 1024 * 1024
                      )

                      done = False

                      while not done:
                          status, done = downloader.next_chunk()

                          if status:
                              print(
                                  f"  {status.progress() * 100:.0f}%"
                              )

                  total += path.stat().st_size

              print(f"File NSP scaricati: {len(files)}")
              print(f"Dimensione totale: {total / 1e9:.2f} GB")

          def upload_ipa():
              import json

              from google.oauth2.credentials import Credentials
              from google.auth.transport.requests import Request

              folder = os.environ["OUTPUT_FOLDER"]
              ipa = pathlib.Path(os.environ["IPA_PATH"])
              token_file = os.environ["OAUTH_TOKEN_FILE"]

              if not ipa.is_file():
                  raise RuntimeError(
                      f"IPA non trovata: {ipa}"
                  )

              with open(token_file, "r") as f:
                  token_data = json.load(f)

              user_creds = Credentials.from_authorized_user_info(
                  token_data,
                  ["https://www.googleapis.com/auth/drive"]
              )

              if user_creds.expired and user_creds.refresh_token:
                  user_creds.refresh(Request())

              if not user_creds.valid:
                  raise RuntimeError(
                      "Token OAuth non valido o impossibile da aggiornare."
                  )

              user_drive = build(
                  "drive",
                  "v3",
                  credentials=user_creds,
                  cache_discovery=False
              )

              metadata = {
                  "name": ipa.name,
                  "parents": [folder],
                  "mimeType": "application/octet-stream"
              }

              media = MediaFileUpload(
                  str(ipa),
                  mimetype="application/octet-stream",
                  resumable=True,
                  chunksize=16 * 1024 * 1024
              )

              result = user_drive.files().create(
                  body=metadata,
                  media_body=media,
                  fields="id,name,size"
              ).execute()

              print("IPA caricata su Drive:", result["name"])
              print(
                  "Dimensione:",
                  result.get("size", "sconosciuta")
              )
              print("ID file:", result["id"])

          mode = os.environ["MODE"]

          if mode == "download":
              download_game()
          elif mode == "upload":
              upload_ipa()
          else:
              raise RuntimeError("Modalità sconosciuta")
          PY

          MODE=download .venv/bin/python "$RUNNER_TEMP/drive.py"

      - name: Check available disk space
        run: |
          df -h "$RUNNER_TEMP"
          du -sh "$RUNNER_TEMP/game"

      - name: Build Metroid Dread IPA
        env:
          DM_GAME: "010093801237C000"
        run: |
          mkdir -p "$RUNNER_TEMP/output"

          .venv/bin/python scripts/build_ipa_from_nsp.py \
            "$RUNNER_TEMP/game" \
            -k "$RUNNER_TEMP/prod.keys" \
            -o "$RUNNER_TEMP/output/MetroidDread.ipa" \
            --app-name "Metroid Dread" \
            --progress lines

          test -s "$RUNNER_TEMP/output/MetroidDread.ipa"

          ls -lh "$RUNNER_TEMP/output/MetroidDread.ipa"

      - name: Upload IPA to Google Drive
        env:
          GOOGLE_DRIVE_OAUTH_TOKEN: ${{ secrets.GOOGLE_DRIVE_OAUTH_TOKEN }}
          GOOGLE_DRIVE_OUTPUT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_OUTPUT_FOLDER_ID }}
        run: |
          printf '%s' "$GOOGLE_DRIVE_OAUTH_TOKEN" \
            > "$RUNNER_TEMP/google-drive-oauth-token.json"

          test -s "$RUNNER_TEMP/google-drive-oauth-token.json"

          MODE=upload \
          OUTPUT_FOLDER="$GOOGLE_DRIVE_OUTPUT_FOLDER_ID" \
          IPA_PATH="$RUNNER_TEMP/output/MetroidDread.ipa" \
          OAUTH_TOKEN_FILE="$RUNNER_TEMP/google-drive-oauth-token.json" \
          .venv/bin/python "$RUNNER_TEMP/drive.py"