      - name: Diagnose shader tools
        continue-on-error: true
        env:
          DM_GAME: "010093801237C000"
        run: |
          echo "=== Xcode ==="
          xcodebuild -version || true
          ls /Applications | grep -i xcode || true

          echo "=== Metal ==="
          xcrun --sdk macosx metal --version || true
          xcrun --sdk iphoneos metal --version || true

          echo "=== SPIRV-Cross ==="
          spirv-cross --version || true

          echo "=== Tools dir ==="
          ls -lah dm/gfx/tools/ || true

          echo "=== Lock file ==="
          cat dm/gfx/tools/*.lock || true

          echo "=== Help ==="
          python3 dm/gfx/tools/dmsh_chain.py --help || true