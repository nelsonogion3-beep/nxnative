name: nxnative IPA build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install xcodegen zstd spirv-cross
          brew install --cask dotnet-sdk

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install lz4 capstone fonttools

      - name: Verify build script
        run: |
          test -f scripts/build_ipa_from_nsp.py
          .venv/bin/python scripts/build_ipa_from_nsp.py -h