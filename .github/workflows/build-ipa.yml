name: diag

'on':
  workflow_dispatch:

jobs:
  diag:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Metal per ogni Xcode
        shell: bash
        run: |
          for x in 26.0 26.1 26.2 26.3; do
            echo "=== Xcode $x ==="
            sudo xcode-select -s /Applications/Xcode_$x.app || true
            xcrun --sdk macosx metal --version 2>&1 | head -1 || true
            xcrun --sdk iphoneos metal --version 2>&1 | head -1 || true
          done

      - name: Come ottenere spirv-cross
        shell: bash
        run: |
          echo "=== dmsh_fetch.py ==="
          cat dm/gfx/tools/dmsh_fetch.py || true
          echo "=== dmsh_chain.py ==="
          cat dm/gfx/tools/dmsh_chain.py || true
          echo "=== dmsh_xlate ==="
          ls -lah dm/gfx/tools/dmsh_xlate || true
          echo "=== dmsh_xlate_bin ==="
          ls dm/gfx/tools/dmsh_xlate_bin | head -30 || true