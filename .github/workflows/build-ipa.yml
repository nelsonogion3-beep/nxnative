      - name: Diagnose shader tools
        env:
          DM_GAME: "010093801237C000"
        run: |
          echo "=== Xcode ==="
          xcodebuild -version

          echo "=== Metal ==="
          xcrun --sdk macosx metal --version
          xcrun --sdk iphoneos metal --version

          echo "=== SPIRV-Cross ==="
          spirv-cross --version || true

          echo "=== Shader chain lock ==="
          cat dm/gfx/tools/dmsh_chain.lock

          echo "=== Translator files ==="
          ls -lah dm/gfx/tools/