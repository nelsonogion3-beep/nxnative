name: nxnative build test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode
        run: xcodebuild -version

      - name: Check Python
        run: |
          python3 --version
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install lz4 capstone fonttools

      - name: Check project files
        run: |
          ls -la
          find . -name 'build_ipa_from_nsp.py'